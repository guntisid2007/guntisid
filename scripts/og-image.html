<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: url("../public/fonts/barlow-condensed-500.woff2") format("woff2");
        font-weight: 500;
      }

      @font-face {
        font-family: "Manrope";
        src: url("../public/fonts/manrope-400.woff2") format("woff2");
        font-weight: 400;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../public/fonts/ibm-plex-mono-400.woff2") format("woff2");
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0b0b0a;
        color: #f4f1e8;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid rgb(244 241 232 / 17%);
        padding: 76px 84px 64px;
      }

      .kicker,
      .domain {
        margin: 0;
        color: #cfb991;
        font: 22px "IBM Plex Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 34px 0 26px;
        font: 500 168px / 0.9 "Barlow Condensed", sans-serif;
        letter-spacing: -0.035em;
      }

      .deck {
        margin: 0;
        color: #c4bfc0;
        font: 34px "Manrope", sans-serif;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .rule {
        width: 120px;
        height: 1px;
        background: #cfb991;
      }

      .domain {
        color: #9d9795;
        letter-spacing: 0.05em;
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="kicker">Purdue University</p>
        <h1>Siddharth Gunti.</h1>
        <p class="deck">Computer Engineering @ Purdue</p>
      </div>
      <footer>
        <span class="rule"></span>
        <p class="domain">guntisid.com</p>
      </footer>
    </div>
  </body>
</html>
